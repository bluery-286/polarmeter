name: PolarMeter Cache Pages

on:
  workflow_dispatch:
  schedule:
    # Weekdays: every 30 minutes as the baseline. Use off-peak minutes because
    # GitHub scheduled workflows can be delayed or dropped around :00/:30.
    - cron: '7,37 * * * 1-5'
    # Korea market confirmation points:
    # 09:30/10:00 KST after open, 15:45/16:30 KST after close/final delayed data.
    - cron: '35 0 * * 1-5'
    - cron: '5 1 * * 1-5'
    - cron: '50 6 * * 1-5'
    - cron: '35 7 * * 1-5'
    # US market confirmation points. Includes both US daylight and standard time.
    # 09:30 ET +30/+60m, 16:00 ET +15/+60m.
    - cron: '5 14,15 * * 1-5'
    - cron: '35 14,15 * * 1-5'
    - cron: '20 20,21 * * 1-5'
    - cron: '5 21,22 * * 1-5'
    # Weekends: hourly so overseas/geopolitics headlines do not sit stale.
    - cron: '0 * * * 0,6'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: polarmeter-cache-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    outputs:
      pages_artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Pages payload
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          python3 tools/polarmeter_github_pages_prepare.py --output ./_site
          python3 tools/polarmeter_github_pages_smoke.py
      - id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        name: Deploy Pages with unique cache build version
        uses: actions/github-script@v8
        env:
          ARTIFACT_ID: ${{ needs.build.outputs.pages_artifact_id }}
        with:
          script: |
            const core = require('@actions/core');
            const crypto = require('crypto');

            const artifactId = Number(process.env.ARTIFACT_ID);
            if (!Number.isFinite(artifactId)) {
              throw new Error(`Invalid Pages artifact id: ${process.env.ARTIFACT_ID}`);
            }

            const seed = `${context.sha}-${context.runId}-${process.env.GITHUB_RUN_ATTEMPT || '1'}`;
            const buildVersion = crypto.createHash('sha1').update(seed).digest('hex');
            const idToken = await core.getIDToken();

            async function requestWithRetry(label, fn, attempts = 4) {
              let lastError;
              for (let attempt = 1; attempt <= attempts; attempt += 1) {
                try {
                  return await fn();
                } catch (error) {
                  lastError = error;
                  const status = error.status || error.response?.status;
                  if (![429, 500, 502, 503, 504].includes(status) || attempt === attempts) {
                    throw error;
                  }
                  core.warning(`${label} failed with HTTP ${status}; retry ${attempt}/${attempts}`);
                  await new Promise((resolve) => setTimeout(resolve, Math.min(2 ** attempt, 10) * 1000));
                }
              }
              throw lastError;
            }

            core.info(`Creating Pages deployment artifact=${artifactId} buildVersion=${buildVersion}`);
            const deployment = await requestWithRetry('create Pages deployment', () => github.request(
              'POST /repos/{owner}/{repo}/pages/deployments',
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifactId,
                pages_build_version: buildVersion,
                oidc_token: idToken,
              },
            ));

            const deploymentId = deployment.data.id || String(deployment.data.status_url || '').split('/').pop() || buildVersion;
            core.info(`Created Pages deployment id=${deploymentId}`);

            const deadline = Date.now() + 10 * 60 * 1000;
            while (Date.now() < deadline) {
              const status = await requestWithRetry('get Pages deployment status', () => github.request(
                'GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}',
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  deploymentId,
                },
              ));
              const deploymentStatus = status.data.status;
              core.info(`Pages deployment status: ${deploymentStatus}`);
              if (deploymentStatus === 'succeed') {
                core.setOutput('page_url', status.data.page_url || deployment.data.page_url || '');
                core.setOutput('status', 'succeed');
                core.setOutput('deployment_id', String(deploymentId));
                core.setOutput('pages_build_version', buildVersion);
                core.info('Reported success!');
                return;
              }
              if ([
                'deployment_failed',
                'deployment_perms_error',
                'deployment_content_failed',
                'deployment_cancelled',
                'deployment_lost',
              ].includes(deploymentStatus)) {
                throw new Error(`Pages deployment failed with status=${deploymentStatus}`);
              }
              await new Promise((resolve) => setTimeout(resolve, 5000));
            }
            throw new Error('Pages deployment timed out');
