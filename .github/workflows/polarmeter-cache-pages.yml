name: PolarMeter Cache Pages

on:
  workflow_dispatch:
  schedule:
    # Weekdays: every 30 minutes as the baseline. Use off-peak minutes because
    # GitHub scheduled workflows can be delayed or dropped around :00/:30.
    - cron: '7,37 * * * 1-5'
    # Korea market confirmation points:
    # 09:30/10:00 KST after open, 15:45/16:30 KST after close/final delayed data.
    - cron: '35 0 * * 1-5'
    - cron: '5 1 * * 1-5'
    - cron: '50 6 * * 1-5'
    - cron: '35 7 * * 1-5'
    # US market confirmation points. Includes both US daylight and standard time.
    # 09:30 ET +30/+60m, 16:00 ET +15/+60m.
    - cron: '5 14,15 * * 1-5'
    - cron: '35 14,15 * * 1-5'
    - cron: '20 20,21 * * 1-5'
    - cron: '5 21,22 * * 1-5'
    # Weekends: two off-peak attempts per hour. The build guard below skips
    # fresh caches, so this adds schedule redundancy without doubling data calls.
    - cron: '17,37 * * * 0,6'

permissions:
  contents: write

concurrency:
  group: polarmeter-cache-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether cache build is needed
        id: cache_guard
        env:
          CACHE_MANIFEST_URL: https://polarmeter.polarbearworks.com/market-snapshot-manifest.json
          MIN_MINUTES_BEFORE_NEXT_REFRESH: '10'
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone

          event_name = os.environ.get('GITHUB_EVENT_NAME', '')
          threshold = float(os.environ.get('MIN_MINUTES_BEFORE_NEXT_REFRESH', '10'))
          should_build = True
          reason = 'manual dispatch always builds'

          if event_name != 'workflow_dispatch':
              url = os.environ['CACHE_MANIFEST_URL']
              try:
                  request = urllib.request.Request(url, headers={'Cache-Control': 'no-cache', 'Pragma': 'no-cache'})
                  with urllib.request.urlopen(request, timeout=20) as response:
                      manifest = json.loads(response.read().decode('utf-8'))
                  next_refresh = datetime.fromisoformat(str(manifest['nextRefreshAt']).replace('Z', '+00:00')).astimezone(timezone.utc)
                  minutes_until = (next_refresh - datetime.now(timezone.utc)).total_seconds() / 60
                  if minutes_until > threshold:
                      should_build = False
                      reason = f'public cache fresh for {minutes_until:.1f}m; skip schedule build'
                  else:
                      reason = f'public cache due soon or stale ({minutes_until:.1f}m); build'
              except Exception as error:
                  should_build = True
                  reason = f'manifest check failed; build to recover: {error}'

          print(reason)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"should_build={'true' if should_build else 'false'}\n")
              output.write(f"reason={reason}\n")
          PY
      - uses: actions/checkout@v4
        if: steps.cache_guard.outputs.should_build == 'true'
      - uses: actions/setup-python@v5
        if: steps.cache_guard.outputs.should_build == 'true'
        with:
          python-version: '3.12'
      - name: Build Pages payload
        if: steps.cache_guard.outputs.should_build == 'true'
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          python3 tools/polarmeter_github_pages_prepare.py --output ./_site
          python3 tools/polarmeter_github_pages_smoke.py
      - uses: actions/upload-pages-artifact@v3
        if: steps.cache_guard.outputs.should_build == 'true'
        with:
          path: ./_site
      - name: Publish Pages branch
        if: steps.cache_guard.outputs.should_build == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd ./_site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update PolarMeter cache ${GITHUB_RUN_ID}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:gh-pages
      - name: Verify public cache publish and retry Pages if needed
        if: steps.cache_guard.outputs.should_build == 'true'
        env:
          PUBLIC_SNAPSHOT_URL: https://polarmeter.polarbearworks.com/market-snapshot-latest.json
          PAGES_PUBLIC_VERIFY_RETRIES: '2'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import time
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          site = Path('_site')
          expected = json.loads((site / 'market-snapshot-latest.json').read_text(encoding='utf-8')).get('generatedAt')
          if not expected:
              raise SystemExit('market-snapshot-latest.json is missing generatedAt')

          public_url = os.environ['PUBLIC_SNAPSHOT_URL']
          run_id = os.environ.get('GITHUB_RUN_ID', 'unknown')
          retries = int(os.environ.get('PAGES_PUBLIC_VERIFY_RETRIES', '2'))

          def public_generated_at(attempt: int, poll: int) -> str | None:
              cache_bust = int(time.time())
              url = f'{public_url}?run={run_id}&attempt={attempt}&poll={poll}&t={cache_bust}'
              request = urllib.request.Request(
                  url,
                  headers={'Cache-Control': 'no-cache', 'Pragma': 'no-cache'},
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  payload = json.loads(response.read().decode('utf-8'))
              return payload.get('generatedAt')

          def wait_for_public(attempt: int, seconds: int = 120) -> tuple[bool, str | None]:
              deadline = time.time() + seconds
              last = None
              poll = 0
              while time.time() < deadline:
                  poll += 1
                  try:
                      last = public_generated_at(attempt, poll)
                      print(
                          f'public cache poll attempt={attempt} poll={poll} '
                          f'generatedAt={last} expected={expected}',
                          flush=True,
                      )
                      if last == expected:
                          return True, last
                  except Exception as error:
                      last = f'error: {error}'
                      print(f'public cache poll attempt={attempt} poll={poll} {last}', flush=True)
                  time.sleep(10)
              return False, last

          last_seen = None
          for attempt in range(retries + 1):
              ok, last_seen = wait_for_public(attempt)
              if ok:
                  print(f'public cache publish verified: generatedAt={expected}', flush=True)
                  sys.exit(0)
              if attempt >= retries:
                  break

              marker = site / '.publish-trigger'
              marker.write_text(
                  '\n'.join([
                      f'run={run_id}',
                      f'attempt={attempt + 1}',
                      f'expectedGeneratedAt={expected}',
                      f'createdAt={datetime.now(timezone.utc).isoformat()}',
                      '',
                  ]),
                  encoding='utf-8',
              )
              subprocess.run(['git', '-C', str(site), 'add', '.publish-trigger'], check=True)
              subprocess.run(
                  ['git', '-C', str(site), 'commit', '-m', f'Retry PolarMeter cache publish {run_id} attempt {attempt + 1}'],
                  check=True,
              )
              subprocess.run(['git', '-C', str(site), 'push', '--force', 'origin', 'HEAD:gh-pages'], check=True)
              print(f'retry pushed gh-pages attempt={attempt + 1}', flush=True)

          raise SystemExit(
              f'public cache did not publish expected generatedAt={expected}; lastSeen={last_seen}'
          )
          PY
