name: PolarMeter Cache Pages

on:
  workflow_dispatch:
  schedule:
    # Weekdays: every 30 minutes as the baseline. Use off-peak minutes because
    # GitHub scheduled workflows can be delayed or dropped around :00/:30.
    - cron: '7,37 * * * 1-5'
    # Korea market confirmation points:
    # 09:30/10:00 KST after open, 15:45/16:30 KST after close/final delayed data.
    - cron: '35 0 * * 1-5'
    - cron: '5 1 * * 1-5'
    - cron: '50 6 * * 1-5'
    - cron: '35 7 * * 1-5'
    # US market confirmation points. Includes both US daylight and standard time.
    # 09:30 ET +30/+60m, 16:00 ET +15/+60m.
    - cron: '5 14,15 * * 1-5'
    - cron: '35 14,15 * * 1-5'
    - cron: '20 20,21 * * 1-5'
    - cron: '5 21,22 * * 1-5'
    # Weekends: hourly off :00 because GitHub scheduled workflows can be
    # delayed or dropped near the top of the hour.
    - cron: '17 * * * 0,6'

permissions:
  contents: write

concurrency:
  group: polarmeter-cache-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Pages payload
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          python3 tools/polarmeter_github_pages_prepare.py --output ./_site
          python3 tools/polarmeter_github_pages_smoke.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - name: Publish Pages branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd ./_site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update PolarMeter cache ${GITHUB_RUN_ID}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:gh-pages
