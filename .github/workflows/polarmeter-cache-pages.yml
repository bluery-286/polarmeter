name: PolarMeter Cache Pages

on:
  workflow_dispatch:
  schedule:
    # Weekdays: hourly baseline for a market temperature briefing app. Critical
    # market confirmation crons below still force builds around open/close.
    - cron: '7 * * * 1-5'
    # Korea market confirmation points:
    # 09:30/10:00 KST after open, 15:45/16:30 KST after close/final delayed data.
    - cron: '35 0 * * 1-5'
    - cron: '5 1 * * 1-5'
    - cron: '50 6 * * 1-5'
    - cron: '35 7 * * 1-5'
    # US market confirmation points. Includes both US daylight and standard time.
    # 09:30 ET +5m daylight, +35/+65m both seasons, 16:00 ET +15/+60m.
    - cron: '35 13 * * 1-5'
    - cron: '5 14,15 * * 1-5'
    - cron: '35 14,15 * * 1-5'
    - cron: '20 20,21 * * 1-5'
    - cron: '5 21,22 * * 1-5'
    # Official US macro release watch. The lightweight guard below only builds
    # when CPI, Employment Situation, or FOMC is within the release window.
    - cron: '6,21,36,51 12,13,14 * * 1-5'
    - cron: '6,21,36,51 18,19 * * 1-5'
    # Weekends: hourly headline/cache check. The worker keeps market data
    # labeled by dataAsOf instead of pretending closed markets are live.
    - cron: '17 * * * 0,6'

permissions:
  contents: write

concurrency:
  group: polarmeter-cache-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether cache build is needed
        id: cache_guard
        env:
          CACHE_MANIFEST_URL: https://polarmeter.polarbearworks.com/market-snapshot-manifest.json
          CACHE_SNAPSHOT_URL: https://polarmeter.polarbearworks.com/market-snapshot-latest.json
          MIN_MINUTES_BEFORE_NEXT_REFRESH: '15'
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone

          event_name = os.environ.get('GITHUB_EVENT_NAME', '')
          event_schedule = os.environ.get('GITHUB_EVENT_SCHEDULE', '')
          threshold = float(os.environ.get('MIN_MINUTES_BEFORE_NEXT_REFRESH', '10'))
          critical_market_schedules = {
              '35 0 * * 1-5',
              '5 1 * * 1-5',
              '50 6 * * 1-5',
              '35 7 * * 1-5',
              '35 13 * * 1-5',
              '5 14,15 * * 1-5',
              '35 14,15 * * 1-5',
              '20 20,21 * * 1-5',
              '5 21,22 * * 1-5',
          }
          macro_watch_schedules = {
              '6,21,36,51 12,13,14 * * 1-5',
              '6,21,36,51 18,19 * * 1-5',
          }
          should_build = True
          reason = 'manual dispatch always builds'

          if event_name == 'schedule' and event_schedule in macro_watch_schedules:
              should_build = False
              reason = 'no official macro release inside the watch window'
              try:
                  request = urllib.request.Request(
                      os.environ['CACHE_SNAPSHOT_URL'],
                      headers={'Cache-Control': 'no-cache', 'Pragma': 'no-cache'},
                  )
                  with urllib.request.urlopen(request, timeout=20) as response:
                      snapshot = json.loads(response.read().decode('utf-8'))
                  now = datetime.now(timezone.utc)
                  for key, event in (snapshot.get('macroEvents') or {}).items():
                      next_release = (event or {}).get('nextRelease') or {}
                      scheduled_at = next_release.get('scheduledAt')
                      if not scheduled_at:
                          continue
                      scheduled = datetime.fromisoformat(str(scheduled_at).replace('Z', '+00:00')).astimezone(timezone.utc)
                      minutes_since = (now - scheduled).total_seconds() / 60
                      if -15 <= minutes_since <= 120:
                          should_build = True
                          reason = f'official macro release watch forces build: {key} {minutes_since:.1f}m'
                          break
              except Exception as error:
                  should_build = True
                  reason = f'macro release watch could not read snapshot; build to recover: {error}'
          elif event_name == 'schedule' and event_schedule in critical_market_schedules:
              reason = f'critical market confirmation schedule forces build: {event_schedule}'
          elif event_name != 'workflow_dispatch':
              url = os.environ['CACHE_MANIFEST_URL']
              try:
                  request = urllib.request.Request(url, headers={'Cache-Control': 'no-cache', 'Pragma': 'no-cache'})
                  with urllib.request.urlopen(request, timeout=20) as response:
                      manifest = json.loads(response.read().decode('utf-8'))
                  next_refresh = datetime.fromisoformat(str(manifest['nextRefreshAt']).replace('Z', '+00:00')).astimezone(timezone.utc)
                  minutes_until = (next_refresh - datetime.now(timezone.utc)).total_seconds() / 60
                  if minutes_until > threshold:
                      should_build = False
                      reason = f'public cache fresh for {minutes_until:.1f}m; skip schedule build'
                  else:
                      reason = f'public cache due soon or stale ({minutes_until:.1f}m); build'
              except Exception as error:
                  should_build = True
                  reason = f'manifest check failed; build to recover: {error}'

          print(reason)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"should_build={'true' if should_build else 'false'}\n")
              output.write(f"reason={reason}\n")
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.cache_guard.outputs.should_build == 'true'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.cache_guard.outputs.should_build == 'true'
        with:
          python-version: '3.12'
      - name: Build Pages payload
        if: steps.cache_guard.outputs.should_build == 'true'
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          python3 tools/polarmeter_security_contract.py
          python3 tools/polarmeter_provider_change_smoke.py
          PYTHONPATH=tools python3 tools/polarmeter_macro_release_contract.py
          PYTHONPATH=tools python3 tools/polarmeter_news_tone_contract.py
          PYTHONPATH=tools python3 tools/polarmeter_pages_strict_failure_contract.py
          python3 tools/polarmeter_github_pages_prepare.py --output "$RUNNER_TEMP/polarmeter-site"
          python3 tools/polarmeter_security_contract.py --public-dir "$RUNNER_TEMP/polarmeter-site"
          python3 tools/polarmeter_github_pages_smoke.py --prepared-site "$RUNNER_TEMP/polarmeter-site"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: steps.cache_guard.outputs.should_build == 'true'
        with:
          path: ${{ runner.temp }}/polarmeter-site
      - name: Publish Pages branch
        if: steps.cache_guard.outputs.should_build == 'true'
        run: |
          set -euo pipefail
          git checkout --orphan polarmeter-pages-publish
          git rm -rf .
          cp -R "$RUNNER_TEMP/polarmeter-site/." .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update PolarMeter cache ${GITHUB_RUN_ID}"
          git push --force origin HEAD:gh-pages
      - name: Verify public cache publish without retry noise
        if: steps.cache_guard.outputs.should_build == 'true'
        env:
          PUBLIC_SNAPSHOT_URL: https://polarmeter.polarbearworks.com/market-snapshot-latest.json
          PAGES_PUBLIC_VERIFY_SECONDS: '480'
          PAGES_PUBLIC_VERIFY_POLL_SECONDS: '10'
          PAGES_PUBLIC_VERIFY_STRICT: 'false'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import sys
          import time
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          site = Path(os.environ['RUNNER_TEMP']) / 'polarmeter-site'
          expected_bytes = (site / 'market-snapshot-latest.json').read_bytes()
          expected_payload = json.loads(expected_bytes.decode('utf-8'))
          expected = expected_payload.get('generatedAt')
          if not expected:
              raise SystemExit('market-snapshot-latest.json is missing generatedAt')
          expected_sha256 = hashlib.sha256(expected_bytes).hexdigest()

          public_url = os.environ['PUBLIC_SNAPSHOT_URL']
          run_id = os.environ.get('GITHUB_RUN_ID', 'unknown')
          verify_seconds = int(os.environ.get('PAGES_PUBLIC_VERIFY_SECONDS', '240'))
          poll_seconds = int(os.environ.get('PAGES_PUBLIC_VERIFY_POLL_SECONDS', '10'))
          strict = os.environ.get('PAGES_PUBLIC_VERIFY_STRICT', '').lower() == 'true'

          def parse_dt(value: str | None) -> datetime | None:
              if not value:
                  return None
              try:
                  parsed = datetime.fromisoformat(str(value).replace('Z', '+00:00'))
              except ValueError:
                  return None
              if parsed.tzinfo is None:
                  parsed = parsed.replace(tzinfo=timezone.utc)
              return parsed.astimezone(timezone.utc)

          expected_dt = parse_dt(expected)

          def public_snapshot(attempt: int, poll: int) -> tuple[str | None, str]:
              cache_bust = int(time.time())
              url = f'{public_url}?run={run_id}&attempt={attempt}&poll={poll}&t={cache_bust}'
              request = urllib.request.Request(
                  url,
                  headers={'Cache-Control': 'no-cache', 'Pragma': 'no-cache'},
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  body = response.read()
              payload = json.loads(body.decode('utf-8'))
              return payload.get('generatedAt'), hashlib.sha256(body).hexdigest()

          def wait_for_public(attempt: int, seconds: int = verify_seconds) -> tuple[bool, str | None]:
              deadline = time.time() + seconds
              last = None
              poll = 0
              while time.time() < deadline:
                  poll += 1
                  try:
                      generated_at, public_sha256 = public_snapshot(attempt, poll)
                      last = f'{generated_at} sha256={public_sha256}'
                      print(
                          f'public cache poll attempt={attempt} poll={poll} '
                          f'generatedAt={generated_at} expected={expected} '
                          f'sha256={public_sha256} expectedSha256={expected_sha256}',
                          flush=True,
                      )
                      if generated_at == expected and public_sha256 == expected_sha256:
                          return True, generated_at
                      generated_dt = parse_dt(generated_at)
                      if expected_dt and generated_dt and generated_dt > expected_dt:
                          print(
                              f'public cache already superseded this run: '
                              f'generatedAt={generated_at} expected={expected}',
                              flush=True,
                          )
                          return True, generated_at
                  except Exception as error:
                      last = f'error: {error}'
                      print(f'public cache poll attempt={attempt} poll={poll} {last}', flush=True)
                  time.sleep(poll_seconds)
              return False, last

          ok, last_seen = wait_for_public(0)
          if ok:
              print(f'public cache publish verified or superseded: expectedGeneratedAt={expected}', flush=True)
              sys.exit(0)

          message = f'public cache did not publish expected generatedAt={expected}; lastSeen={last_seen}'
          if strict:
              raise SystemExit(message)
          print(f'::warning::{message}', flush=True)
          print(
              'public cache propagation remains guarded by ops monitor/watchdog; '
              'not failing this workflow for CDN/Pages lag.',
              flush=True,
          )
          PY
