name: PolarMeter Cache Pages

on:
  workflow_dispatch:
  schedule:
    # Weekdays: every 30 minutes as the baseline. Use off-peak minutes because
    # GitHub scheduled workflows can be delayed or dropped around :00/:30.
    - cron: '7,37 * * * 1-5'
    # Korea market confirmation points:
    # 09:30/10:00 KST after open, 15:45/16:30 KST after close/final delayed data.
    - cron: '35 0 * * 1-5'
    - cron: '5 1 * * 1-5'
    - cron: '50 6 * * 1-5'
    - cron: '35 7 * * 1-5'
    # US market confirmation points. Includes both US daylight and standard time.
    # 09:30 ET +30/+60m, 16:00 ET +15/+60m.
    - cron: '5 14,15 * * 1-5'
    - cron: '35 14,15 * * 1-5'
    - cron: '20 20,21 * * 1-5'
    - cron: '5 21,22 * * 1-5'
    # Weekends: two off-peak attempts per hour. The build guard below skips
    # fresh caches, so this adds schedule redundancy without doubling data calls.
    - cron: '17,37 * * * 0,6'

permissions:
  contents: write

concurrency:
  group: polarmeter-cache-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether cache build is needed
        id: cache_guard
        env:
          CACHE_MANIFEST_URL: https://polarmeter.polarbearworks.com/market-snapshot-manifest.json
          MIN_MINUTES_BEFORE_NEXT_REFRESH: '10'
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone

          event_name = os.environ.get('GITHUB_EVENT_NAME', '')
          threshold = float(os.environ.get('MIN_MINUTES_BEFORE_NEXT_REFRESH', '10'))
          should_build = True
          reason = 'manual dispatch always builds'

          if event_name != 'workflow_dispatch':
              url = os.environ['CACHE_MANIFEST_URL']
              try:
                  request = urllib.request.Request(url, headers={'Cache-Control': 'no-cache', 'Pragma': 'no-cache'})
                  with urllib.request.urlopen(request, timeout=20) as response:
                      manifest = json.loads(response.read().decode('utf-8'))
                  next_refresh = datetime.fromisoformat(str(manifest['nextRefreshAt']).replace('Z', '+00:00')).astimezone(timezone.utc)
                  minutes_until = (next_refresh - datetime.now(timezone.utc)).total_seconds() / 60
                  if minutes_until > threshold:
                      should_build = False
                      reason = f'public cache fresh for {minutes_until:.1f}m; skip schedule build'
                  else:
                      reason = f'public cache due soon or stale ({minutes_until:.1f}m); build'
              except Exception as error:
                  should_build = True
                  reason = f'manifest check failed; build to recover: {error}'

          print(reason)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"should_build={'true' if should_build else 'false'}\n")
              output.write(f"reason={reason}\n")
          PY
      - uses: actions/checkout@v4
        if: steps.cache_guard.outputs.should_build == 'true'
      - uses: actions/setup-python@v5
        if: steps.cache_guard.outputs.should_build == 'true'
        with:
          python-version: '3.12'
      - name: Build Pages payload
        if: steps.cache_guard.outputs.should_build == 'true'
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          python3 tools/polarmeter_github_pages_prepare.py --output ./_site
          python3 tools/polarmeter_github_pages_smoke.py
      - uses: actions/upload-pages-artifact@v3
        if: steps.cache_guard.outputs.should_build == 'true'
        with:
          path: ./_site
      - name: Publish Pages branch
        if: steps.cache_guard.outputs.should_build == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd ./_site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update PolarMeter cache ${GITHUB_RUN_ID}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:gh-pages
