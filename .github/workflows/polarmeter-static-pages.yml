name: PolarMeter Static Pages Safety Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'github-pages-site/**'
      - '.github/workflows/polarmeter-static-pages.yml'

permissions:
  contents: read

concurrency:
  group: polarmeter-static-pages-check
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate checked-in Pages sources without publishing
        run: python3 tools/polarmeter_security_contract.py --public-dir ./github-pages-site
